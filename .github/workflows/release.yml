name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check if release is needed
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/enappsys/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_VERSION="${LATEST_TAG#v}"
            if [ "$LATEST_VERSION" = "$VERSION" ] || [ "$(printf '%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "Version $VERSION is not greater than latest tag $LATEST_TAG, skipping release"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Will release v$VERSION (previous: ${LATEST_TAG:-none})"

      - uses: actions/setup-python@v5
        if: steps.version.outputs.should_release == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.version.outputs.should_release == 'true'
        run: pip install -e ".[dev]" build

      - name: Run tests
        if: steps.version.outputs.should_release == 'true'
        env:
          ENAPPSYS_USER: ${{ secrets.ENAPPSYS_USER }}
          ENAPPSYS_SECRET: ${{ secrets.ENAPPSYS_SECRET }}
        run: pytest

      - name: Build package
        if: steps.version.outputs.should_release == 'true'
        run: python -m build

      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        run: |
          PREVIOUS_TAG="${{ steps.version.outputs.previous_tag }}"
          {
            echo "This release includes:"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..HEAD" --format="- %s"
            else
              git log --format="- %s"
            fi
          } > release_notes.md

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: dist/*

      - name: Publish to PyPI
        if: steps.version.outputs.should_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
